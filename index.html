<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Recetario Fit</title>
<style>
:root{--bg:#f7f0e7;--card:#fffdf9;--ink:#382b24;--muted:#78685c;--brown:#684936;--brown2:#9a7658;--cream:#efe0ce;--line:#e5d4c2;--shadow:0 10px 30px rgba(67,45,31,.10);--danger:#8b2f2f}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#4d3328,#8d674e);color:#fff;padding:34px 18px 30px}.wrap{max-width:1180px;margin:auto}h1{margin:0;font-size:clamp(2.2rem,7vw,4.1rem)}.lead{opacity:.9;margin:8px 0 22px}
.tools{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink)}textarea{min-height:100px;resize:vertical}
.btn{border:0;border-radius:13px;padding:12px 15px;background:var(--brown);color:#fff;font-weight:800;cursor:pointer}.btn.light{background:#fff;color:var(--brown)}.btn.soft{background:var(--cream);color:var(--brown)}.btn.danger{background:var(--danger)}
main{padding:24px 18px 60px}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.pill{background:var(--card);border:1px solid var(--line);padding:9px 13px;border-radius:999px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.visual{height:145px;background:linear-gradient(135deg,#ead7c1,#d4b79a);display:grid;place-items:center;font-size:4.2rem}.body{padding:17px}.tag{display:inline-block;background:var(--cream);color:var(--brown);font-size:.8rem;font-weight:800;padding:6px 10px;border-radius:999px}h2{font-size:1.22rem;margin:13px 0 6px}.meta{font-size:.9rem;color:var(--muted)}
.macros{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}.macro{background:#faf4ed;padding:8px 4px;border-radius:10px;text-align:center;font-size:.68rem;color:var(--muted)}.macro b{display:block;color:var(--ink);font-size:.88rem}.actions{display:flex;gap:8px}.actions button{flex:1}
dialog{border:0;padding:0;border-radius:22px;width:min(860px,calc(100% - 24px));box-shadow:0 25px 80px #0005}dialog::backdrop{background:#0007}.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.dc{padding:20px;max-height:78vh;overflow:auto}
.servbox{background:#fbf5ee;border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0}.serv{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.serv button{width:40px;height:40px;border:0;border-radius:50%;background:var(--brown);color:#fff;font-size:1.25rem;cursor:pointer}
table{width:100%;border-collapse:collapse;margin:12px 0 18px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}th{color:var(--brown)}.source{font-size:.74rem;padding:3px 7px;border-radius:999px;background:#f3e7db;color:var(--brown);white-space:nowrap}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}label{font-weight:800;font-size:.9rem}.ingredient-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}.ingredient-row button{padding:11px}.muted{font-size:.82rem;color:var(--muted)}ul,ol{padding-left:23px}li{margin-bottom:8px;line-height:1.45}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr 1fr}#q{grid-column:1/-1}}
@media(max-width:650px){.grid{grid-template-columns:1fr}.tools{grid-template-columns:1fr}#q{grid-column:auto}.macros{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.ingredient-row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Mi Recetario Fit</h1><div class="lead">Recetas con cálculo nutricional automático.</div>
<div class="tools">
<input id="q" placeholder="Buscar receta o ingrediente…">
<select id="cat"><option value="">Todas las categorías</option></select>
<select id="flt"><option value="">Todos los filtros</option><option value="low">Menos de 300 kcal/porción</option><option value="protein">20 g o más proteína/porción</option><option value="quick">Menos de 30 min</option></select>
<button class="btn light" id="newBtn">+ Nueva receta</button>
</div></div></header>

<main><div class="wrap">
<div class="summary"><span class="pill" id="count"></span><span class="pill">Las recetas nuevas se guardan en este navegador</span></div>
<section id="grid" class="grid"></section>
</div></main>

<dialog id="viewDlg"><div class="dh"><strong id="viewTitle"></strong><button class="btn soft" onclick="viewDlg.close()">Cerrar</button></div><div class="dc" id="viewContent"></div></dialog>

<dialog id="editDlg"><div class="dh"><strong id="editTitle">Nueva receta</strong><button class="btn soft" onclick="editDlg.close()">Cerrar</button></div>
<form class="dc" id="recipeForm">
<input type="hidden" id="editId">
<div class="formgrid">
<div class="fg"><label>Nombre</label><input id="name" required></div>
<div class="fg"><label>Categoría</label><input id="category" required placeholder="Desayuno, Almuerzo..."></div>
<div class="fg"><label>Porciones</label><input id="servings" type="number" min="1" value="1" required></div>
<div class="fg"><label>Tiempo total (min)</label><input id="time" type="number" min="1" value="20" required></div>
<div class="fg"><label>Ícono</label><input id="emoji" value="🥗"></div>
<div class="fg"><label>Ingredientes</label><button type="button" class="btn soft" id="addIngredient">+ Agregar ingrediente</button></div>
<div class="fg full"><div id="ingredientRows"></div></div>
<div class="fg full"><label>Preparación — un paso por línea</label><textarea id="steps" required></textarea></div>
<div class="fg full"><button class="btn" type="submit">Guardar receta</button></div>
<div class="fg full muted">Por ahora, las recetas que agregues o edites quedan guardadas solo en este navegador. Más adelante podemos sincronizarlas entre PC y teléfono con una base de datos online.</div>
</div>
</form></dialog>

<script>
const ING={"harina_avena": {"name": "Harina de avena integral", "base_unit": "g", "kcal": 389, "protein": 16.9, "carbs": 66.3, "fat": 6.9, "fiber": 10.6, "source": "genérico"}, "platano": {"name": "Plátano", "base_unit": "g", "kcal": 89, "protein": 1.1, "carbs": 22.8, "fat": 0.3, "fiber": 2.6, "source": "genérico", "unit_weight": 118}, "huevo": {"name": "Huevo entero", "base_unit": "g", "kcal": 143, "protein": 12.6, "carbs": 0.7, "fat": 9.5, "fiber": 0, "source": "genérico", "unit_weight": 50}, "clara": {"name": "Clara de huevo", "base_unit": "g", "kcal": 52, "protein": 10.9, "carbs": 0.7, "fat": 0.2, "fiber": 0, "source": "genérico", "unit_weight": 33}, "aceite_coco": {"name": "Aceite de coco", "base_unit": "g", "kcal": 892, "protein": 0, "carbs": 0, "fat": 100, "fiber": 0, "source": "genérico", "tbsp_weight": 13.6, "tsp_weight": 4.5}, "nueces": {"name": "Nueces", "base_unit": "g", "kcal": 654, "protein": 15.2, "carbs": 13.7, "fat": 65.2, "fiber": 6.7, "source": "genérico"}, "cacao_carat": {"name": "Cacao Carat Extra Amargo (Puratos)", "base_unit": "g", "kcal": 308, "protein": 22.1, "carbs": 11.4, "fat": 11.0, "fiber": 0, "source": "etiqueta", "tbsp_weight": 5}, "alusweet_gran": {"name": "AluSweet Alulosa granulada", "base_unit": "g", "kcal": 184, "protein": 0, "carbs": 85.4, "fat": 0, "fiber": 59.7, "source": "etiqueta", "tsp_weight": 5}, "alusweet_gotas": {"name": "AluSweet Alulosa gotas", "base_unit": "ml", "kcal": 2, "protein": 0, "carbs": 0, "fat": 0, "fiber": 0, "source": "etiqueta", "drops_per_ml": 20}, "yogurt_colun": {"name": "Yogurt Colun natural sin lactosa", "base_unit": "g", "kcal": 44, "protein": 6.2, "carbs": 4.2, "fat": 0.3, "fiber": 0, "source": "etiqueta", "pack_weight": 150}, "amapola": {"name": "Semilla de amapola", "base_unit": "g", "kcal": 525, "protein": 18.0, "carbs": 28.1, "fat": 41.6, "fiber": 19.5, "source": "genérico"}, "limon": {"name": "Limón", "base_unit": "g", "kcal": 29, "protein": 1.1, "carbs": 9.3, "fat": 0.3, "fiber": 2.8, "source": "genérico", "unit_weight": 58}, "maizena": {"name": "Maizena / almidón de maíz", "base_unit": "g", "kcal": 381, "protein": 0.3, "carbs": 91.3, "fat": 0.1, "fiber": 0.9, "source": "genérico", "tbsp_weight": 8}, "pollo": {"name": "Pechuga de pollo sin piel", "base_unit": "g", "kcal": 120, "protein": 22.5, "carbs": 0, "fat": 2.6, "fiber": 0, "source": "genérico"}, "atun": {"name": "Atún al agua drenado", "base_unit": "g", "kcal": 116, "protein": 25.5, "carbs": 0, "fat": 0.8, "fiber": 0, "source": "genérico"}, "mozzarella": {"name": "Queso mozzarella", "base_unit": "g", "kcal": 280, "protein": 28, "carbs": 3.1, "fat": 17, "fiber": 0, "source": "genérico"}, "leche_colun": {"name": "Leche Colun descremada sin lactosa", "base_unit": "ml", "kcal": 34, "protein": 3.3, "carbs": 4.7, "fat": 0.1, "fiber": 0, "source": "etiqueta", "tbsp_ml": 15, "tsp_ml": 5, "cup_ml": 200}, "vainilla": {"name": "Esencia de vainilla", "base_unit": "ml", "kcal": 288, "protein": 0.1, "carbs": 12.7, "fat": 0.1, "fiber": 0, "source": "genérico", "tbsp_ml": 15, "tsp_ml": 5}};
const DEFAULTS=[{"id": 1, "name": "Queque fit de plátano", "category": "Postres", "servings": 8, "time": 50, "emoji": "🍌", "items": [{"key": "platano", "qty": 300, "unit": "g"}, {"key": "huevo", "qty": 2, "unit": "un"}, {"key": "harina_avena", "qty": 180, "unit": "g"}, {"key": "aceite_coco", "qty": 20, "unit": "g"}, {"key": "alusweet_gran", "qty": 25, "unit": "g"}, {"key": "vainilla", "qty": 5, "unit": "ml"}], "steps": ["Precalienta el horno a 180 °C.", "Muele los plátanos y mézclalos con los huevos.", "Agrega harina de avena, aceite de coco, AluSweet y vainilla.", "Hornea entre 35 y 40 minutos."]}, {"id": 2, "name": "Avena proteica con yogurt", "category": "Desayuno", "servings": 1, "time": 8, "emoji": "🥣", "items": [{"key": "harina_avena", "qty": 50, "unit": "g"}, {"key": "yogurt_colun", "qty": 150, "unit": "g"}, {"key": "leche_colun", "qty": 100, "unit": "ml"}, {"key": "platano", "qty": 80, "unit": "g"}], "steps": ["Mezcla la harina de avena con la leche.", "Agrega el yogurt y el plátano.", "Sirve de inmediato o deja reposar en refrigeración."]}, {"id": 3, "name": "Pollo con mozzarella", "category": "Almuerzo", "servings": 2, "time": 30, "emoji": "🍗", "items": [{"key": "pollo", "qty": 300, "unit": "g"}, {"key": "mozzarella", "qty": 60, "unit": "g"}, {"key": "limon", "qty": 30, "unit": "g"}], "steps": ["Condimenta la pechuga y cocínala a la plancha.", "Agrega la mozzarella al final.", "Termina con jugo de limón."]}, {"id": 4, "name": "Mousse de cacao y yogurt", "category": "Postres", "servings": 2, "time": 10, "emoji": "🍫", "items": [{"key": "yogurt_colun", "qty": 300, "unit": "g"}, {"key": "cacao_carat", "qty": 15, "unit": "g"}, {"key": "alusweet_gotas", "qty": 10, "unit": "gotas"}], "steps": ["Mezcla el yogurt con el cacao.", "Añade AluSweet gotas.", "Refrigera antes de servir."]}, {"id": 5, "name": "Tortilla de claras y mozzarella", "category": "Cena", "servings": 1, "time": 15, "emoji": "🍳", "items": [{"key": "clara", "qty": 5, "unit": "un"}, {"key": "huevo", "qty": 1, "unit": "un"}, {"key": "mozzarella", "qty": 30, "unit": "g"}], "steps": ["Bate las claras con el huevo entero.", "Cocina en una sartén antiadherente.", "Agrega la mozzarella y dobla la tortilla."]}];
const STORAGE_KEY="mrf-recipes-v7";

function loadRecipes(){
  try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)); if(Array.isArray(x)&&x.length)return x;}catch(e){}
  localStorage.setItem(STORAGE_KEY,JSON.stringify(DEFAULTS));
  return JSON.parse(JSON.stringify(DEFAULTS));
}
let RECIPES=loadRecipes();

const q=document.getElementById("q"),cat=document.getElementById("cat"),flt=document.getElementById("flt"),grid=document.getElementById("grid");
const viewDlg=document.getElementById("viewDlg"),editDlg=document.getElementById("editDlg");

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(RECIPES));}
function baseAmount(item){
  const ing=ING[item.key];
  if(item.unit==="g"||item.unit==="ml")return item.qty;
  if(item.unit==="un"&&ing.unit_weight)return item.qty*ing.unit_weight;
  if(item.unit==="pote"&&ing.pack_weight)return item.qty*ing.pack_weight;
  if(item.unit==="gotas"&&ing.drops_per_ml)return item.qty/ing.drops_per_ml;
  if(item.unit==="cda")return item.qty*(ing.tbsp_weight||ing.tbsp_ml||1);
  if(item.unit==="cdta")return item.qty*(ing.tsp_weight||ing.tsp_ml||1);
  if(item.unit==="taza")return item.qty*(ing.cup_ml||1);
  return item.qty;
}
function calcItem(item){const ing=ING[item.key],f=baseAmount(item)/100;return{kcal:ing.kcal*f,protein:ing.protein*f,carbs:ing.carbs*f,fat:ing.fat*f,fiber:ing.fiber*f}}
function calcRecipe(r){return r.items.map(calcItem).reduce((a,n)=>({kcal:a.kcal+n.kcal,protein:a.protein+n.protein,carbs:a.carbs+n.carbs,fat:a.fat+n.fat,fiber:a.fiber+n.fiber}),{kcal:0,protein:0,carbs:0,fat:0,fiber:0})}
function round(n,d=1){return Math.round(n*10**d)/10**d}
function refreshCats(){
 const cur=cat.value; const cs=[...new Set(RECIPES.map(r=>r.category))].sort();
 cat.innerHTML='<option value="">Todas las categorías</option>'+cs.map(c=>`<option>${c}</option>`).join("");
 cat.value=cs.includes(cur)?cur:"";
}
function matches(r){
 const t=calcRecipe(r), per={kcal:t.kcal/r.servings,protein:t.protein/r.servings};
 const s=q.value.trim().toLowerCase(),txt=(r.name+" "+r.items.map(i=>ING[i.key]?.name||"").join(" ")).toLowerCase();
 let ok=!s||txt.includes(s); ok=ok&&(!cat.value||r.category===cat.value);
 if(flt.value==="low")ok=ok&&per.kcal<300;if(flt.value==="protein")ok=ok&&per.protein>=20;if(flt.value==="quick")ok=ok&&r.time<30;return ok;
}
function render(){
 refreshCats(); const list=RECIPES.filter(matches); document.getElementById("count").textContent=`${list.length} receta${list.length===1?"":"s"}`;
 grid.innerHTML=list.map(r=>{const t=calcRecipe(r),p=Object.fromEntries(Object.entries(t).map(([k,v])=>[k,v/r.servings]));return `
 <article class="card"><div class="visual">${r.emoji||"🥗"}</div><div class="body"><span class="tag">${r.category}</span><h2>${r.name}</h2><div class="meta">⏱ ${r.time} min · 🍽 ${r.servings} porciones</div>
 <div class="macros"><div class="macro"><b>${round(p.kcal,0)}</b>kcal</div><div class="macro"><b>${round(p.protein)} g</b>prot.</div><div class="macro"><b>${round(p.carbs)} g</b>carb.</div><div class="macro"><b>${round(p.fat)} g</b>grasas</div><div class="macro"><b>${round(p.fiber)} g</b>fibra</div></div>
 <div class="actions"><button class="btn" onclick="openRecipe(${r.id})">Ver</button><button class="btn soft" onclick="editRecipe(${r.id})">Editar</button><button class="btn danger" onclick="deleteRecipe(${r.id})">Eliminar</button></div>
 </div></article>`}).join("");
}
function displayItem(i,f){
 const ing=ING[i.key], qty=i.qty*f, n=round(qty,2);
 if(i.unit==="un"){
   const singular=ing.name;
   let plural=singular;
   if(singular==="Huevo entero") plural="Huevos enteros";
   else if(singular==="Clara de huevo") plural="Claras de huevo";
   else if(singular==="Plátano") plural="Plátanos";
   else if(singular==="Limón") plural="Limones";
   if(Number.isInteger(n)) return `${n} ${n===1?singular.toLowerCase():plural.toLowerCase()}`;
   const grams=ing.unit_weight ? round(qty*ing.unit_weight,0) : null;
   return grams ? `${n} ${plural.toLowerCase()} (aprox. ${grams} g)` : `${n} ${plural.toLowerCase()}`;
 }
 const unitNames={pote:["pote","potes"],gotas:["gota","gotas"],cda:["cucharada","cucharadas"],cdta:["cucharadita","cucharaditas"],taza:["taza","tazas"]};
 if(unitNames[i.unit]) return `${n} ${n===1?unitNames[i.unit][0]:unitNames[i.unit][1]} de ${ing.name.toLowerCase()}`;
 return `${n} ${i.unit} de ${ing.name.toLowerCase()}`;
}
function openRecipe(id){
 const r=RECIPES.find(x=>x.id===id);let serv=r.servings;
 function draw(){
  const factor=serv/r.servings,t=calcRecipe(r),adj=Object.fromEntries(Object.entries(t).map(([k,v])=>[k,v*factor])),per=Object.fromEntries(Object.entries(adj).map(([k,v])=>[k,v/serv]));
  document.getElementById("viewTitle").textContent=r.name;
  document.getElementById("viewContent").innerHTML=`<span class="tag">${r.category}</span><div class="servbox"><div class="serv"><strong>Porciones:</strong><button id="minus">−</button><strong>${serv}</strong><button id="plus">+</button></div><div class="muted">Receta original: ${r.servings} porciones</div></div>
  <h3>Información nutricional</h3><table><tr><th></th><th>Receta ajustada</th><th>Por porción</th></tr>
  ${[["kcal","Calorías"," kcal"],["protein","Proteínas"," g"],["carbs","Carbohidratos"," g"],["fat","Grasas"," g"],["fiber","Fibra"," g"]].map(x=>`<tr><td>${x[1]}</td><td>${round(adj[x[0]])}${x[2]}</td><td>${round(per[x[0]])}${x[2]}</td></tr>`).join("")}</table>
  <h3>Ingredientes</h3><ul>${r.items.map(i=>`<li>${displayItem(i,factor)} <span class="source">${ING[i.key].source}</span></li>`).join("")}</ul>
  <h3>Preparación</h3><ol>${r.steps.map(s=>`<li>${s}</li>`).join("")}</ol>`;
  document.getElementById("minus").onclick=()=>{if(serv>1){serv--;draw()}};document.getElementById("plus").onclick=()=>{serv++;draw()};
 }
 draw();viewDlg.showModal();
}
function ingredientSelect(selected=""){
 return `<select class="ing-key">${Object.entries(ING).sort((a,b)=>a[1].name.localeCompare(b[1].name)).map(([k,v])=>`<option value="${k}" ${k===selected?"selected":""}>${v.name}</option>`).join("")}</select>`;
}
function addIngredientRow(item={key:"harina_avena",qty:100,unit:"g"}){
 const div=document.createElement("div");div.className="ingredient-row";div.innerHTML=`<div>${ingredientSelect(item.key)}</div><div><input class="ing-qty" type="number" step="0.01" min="0" value="${item.qty}" required></div><div><select class="ing-unit">${["g","ml","un","pote","gotas","cda","cdta","taza"].map(u=>`<option ${u===item.unit?"selected":""}>${u}</option>`).join("")}</select></div><button type="button" class="btn danger">×</button>`;div.querySelector("button").onclick=()=>div.remove();document.getElementById("ingredientRows").appendChild(div);
}
function clearForm(){document.getElementById("editId").value="";document.getElementById("name").value="";document.getElementById("category").value="";document.getElementById("servings").value=1;document.getElementById("time").value=20;document.getElementById("emoji").value="🥗";document.getElementById("steps").value="";document.getElementById("ingredientRows").innerHTML="";addIngredientRow();}
document.getElementById("newBtn").onclick=()=>{clearForm();document.getElementById("editTitle").textContent="Nueva receta";editDlg.showModal();};
document.getElementById("addIngredient").onclick=()=>addIngredientRow();
function editRecipe(id){const r=RECIPES.find(x=>x.id===id);document.getElementById("editTitle").textContent="Editar receta";document.getElementById("editId").value=r.id;document.getElementById("name").value=r.name;document.getElementById("category").value=r.category;document.getElementById("servings").value=r.servings;document.getElementById("time").value=r.time;document.getElementById("emoji").value=r.emoji||"🥗";document.getElementById("steps").value=r.steps.join("\n");document.getElementById("ingredientRows").innerHTML="";r.items.forEach(addIngredientRow);editDlg.showModal();}
function deleteRecipe(id){if(confirm("¿Eliminar esta receta?")){RECIPES=RECIPES.filter(r=>r.id!==id);save();render();}}
document.getElementById("recipeForm").onsubmit=e=>{e.preventDefault();const rows=[...document.querySelectorAll(".ingredient-row")];const items=rows.map(row=>({key:row.querySelector(".ing-key").value,qty:+row.querySelector(".ing-qty").value,unit:row.querySelector(".ing-unit").value})).filter(i=>i.qty>0);const id=+document.getElementById("editId").value||Date.now();const obj={id,name:document.getElementById("name").value.trim(),category:document.getElementById("category").value.trim(),servings:+document.getElementById("servings").value,time:+document.getElementById("time").value,emoji:document.getElementById("emoji").value.trim()||"🥗",items,steps:document.getElementById("steps").value.split("\n").map(x=>x.trim()).filter(Boolean)};const ix=RECIPES.findIndex(r=>r.id===id);if(ix>=0)RECIPES[ix]=obj;else RECIPES.push(obj);save();editDlg.close();render();};
[q,cat,flt].forEach(el=>el.addEventListener("input",render));render();
</script>
</body></html>
